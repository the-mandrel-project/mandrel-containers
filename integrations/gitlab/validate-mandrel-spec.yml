spec:
  inputs:
    stage:
      description: Pipeline stage in which to execute validation. Defaults to lint.
      type: string
      default: lint
    spec_path:
      description: Relative path to the Mandrel specification file.
      type: string
      default: mandrel-spec.yaml
    image_tag:
      description: Container image tag for the Mandrel CLI container.
      type: string
      default: latest
    strict:
      description: Escalate warnings to fatal errors.
      type: boolean
      default: false
    allow_unclaimed_extensions:
      description: Allow unclaimed extension fields during validation.
      type: boolean
      default: false
---

# Validates a Mandrel Spec against schema and governance rules using the
# official Mandrel CLI container.

validate-mandrel-spec:
  stage: $[[ inputs.stage ]]
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  cache: []
  before_script:
    - |
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        echo "waiting for the docker daemon ($i/30)"
        sleep 2
      done
      docker info >/dev/null || { echo "ERROR: docker daemon unreachable"; exit 1; }
  script:
    - |
      EXTRA_ARGS=""
      if [ "$[[ inputs.strict ]]" = "true" ]; then
        EXTRA_ARGS="$EXTRA_ARGS --strict"
      fi
      if [ "$[[ inputs.allow_unclaimed_extensions ]]" = "true" ]; then
        EXTRA_ARGS="$EXTRA_ARGS --allow-unclaimed-extensions"
      fi
      docker run --rm \
        -v "$CI_PROJECT_DIR":/workspace:ro \
        -w /workspace \
        "registry.gitlab.com/the-mandrel-project/mandrel-containers/cli:$[[ inputs.image_tag ]]" \
        validate $EXTRA_ARGS "$[[ inputs.spec_path ]]"
